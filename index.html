<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Agenda</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="painel-meses">
      <section>
        <header class="date-header">
          <button class="botao-voltar"><h2>Ano</h2></button>
          <div class="nav-group">
            <button class="botao-nav">
              <i class="fa-solid fa-chevron-up"></i>
            </button>
            <button class="botao-nav">
              <i class="fa-solid fa-chevron-down"></i>
            </button>
          </div>
        </header>
        <main>Meses</main>
      </section>
    </div>

    <div class="painel-dias">
      <section>
        <header class="date-header">
          <button class="botao-voltar"><h2>Mês</h2></button>
          <div class="nav-group">
            <button class="botao-nav">
              <i class="fa-solid fa-chevron-up"></i>
            </button>
            <button class="botao-nav">
              <i class="fa-solid fa-chevron-down"></i>
            </button>
          </div>
        </header>
        <main>Dias</main>
      </section>
    </div>

    <div class="painel-agenda">
      <section>
        <header class="date-header">
          <button class="botao-voltar"><h2>Dia</h2></button>
          <div class="nav-group">
            <button class="botao-nav">
              <i class="fa-solid fa-chevron-up"></i>
            </button>
            <button class="botao-nav">
              <i class="fa-solid fa-chevron-down"></i>
            </button>
          </div>
        </header>
        <main>Horário</main>
      </section>
    </div>
  </body>
</html>
